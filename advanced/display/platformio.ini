[platformio]
default_envs = workshop_demo
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib

[env]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
extra_scripts = pre:firmware/prepare.py
board_build.embed_files = .generated/x509_crt_bundle.bin
lib_ignore = bb_spi_lcd
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; The starter draws one screen. Register more screens without another firmware environment.
[env:workshop]
build_flags = ${env.build_flags}

[env:workshop_demo]
build_flags = ${env.build_flags} -DWORKSHOP_FORCE_DEMO=1
